<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>南投縣每月村里複式動員巡檢系統</title>
  <!-- Tailwind CSS & Leaflet -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* iOS 霧面毛玻璃與原生質感 */
    .ios-blur {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .ios-blur-dark {
      background: rgba(30, 30, 32, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    /* 隱藏滾動條但保持可滾動 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Leaflet 原生樣式覆寫：重構為高級戰情卡片 */
    .leaflet-popup-content-wrapper {
      background: rgba(255, 255, 255, 0.92) !important;
      backdrop-filter: blur(25px) !important;
      -webkit-backdrop-filter: blur(25px) !important;
      border-radius: 1.25rem !important;
      padding: 0 !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.6) !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      line-height: 1.4 !important;
    }
    .leaflet-popup-tip {
      background: rgba(255, 255, 255, 0.92) !important;
    }
    .leaflet-container a.leaflet-popup-close-button {
      top: 12px !important;
      right: 12px !important;
      width: 24px !important;
      height: 24px !important;
      color: #8E8E93 !important;
      font: 16px/24px -apple-system, BlinkMacSystemFont, sans-serif !important;
      background: rgba(0, 0, 0, 0.05) !important;
      border-radius: 50% !important;
      text-align: center !important;
      padding: 0 !important;
    }
    /* 脈動呼吸燈動畫 */
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .pulse-dot { animation: pulse-dot 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-[#F2F2F7] font-sans antialiased text-[#1C1C1E] select-none overflow-hidden h-screen w-screen">

  <!-- 滿版地圖容器 -->
  <div id="map" class="absolute inset-0 z-0"></div>

  <!-- 頂部浮動 HUD 戰情膠囊列 -->
  <header class="absolute top-4 left-4 right-4 z-20 flex flex-col gap-2 pointer-events-none">
    <div class="ios-blur rounded-2xl p-3 shadow-lg border border-white/60 pointer-events-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="bg-[#007AFF] text-white text-xs font-bold px-2 py-1 rounded-lg">投</span>
        <div>
          <h1 class="text-sm font-bold leading-tight">村里複式動員巡檢</h1>
          <p id="hudProgress" class="text-[10px] text-gray-500 font-medium">讀取進度中...</p>
        </div>
      </div>
      <!-- 月份選擇器 -->
      <div class="flex items-center gap-1.5 bg-gray-200/70 p-1 rounded-xl">
        <select id="monthSelect" onchange="onMonthChange()" class="bg-transparent text-xs font-bold text-gray-800 pr-1 pl-2 py-0.5 focus:outline-none cursor-pointer">
          <option value="1">115年 01月</option>
          <option value="2">115年 02月</option>
          <option value="3">115年 03月</option>
          <option value="4">115年 04月</option>
          <option value="5">115年 05月</option>
          <option value="6">115年 06月</option>
          <option value="7">115年 07月</option>
          <option value="8">115年 08月</option>
          <option value="9" selected>115年 09月</option>
          <option value="10">115年 10月</option>
          <option value="11">115年 11月</option>
          <option value="12">115年 12月</option>
        </select>
      </div>
    </div>

    <!-- 13 鄉鎮動態膠囊橫向滑動列 -->
    <div id="townshipPillBar" class="pointer-events-auto flex gap-1.5 overflow-x-auto no-scrollbar py-1">
      <!-- 程式動態渲染膠囊按鈕 -->
    </div>
  </header>

  <!-- 右側懸浮控制鈕群 (FAB) -->
  <aside class="absolute right-4 bottom-8 z-20 flex flex-col gap-3 pointer-events-auto">
    <!-- 清單抽屜按鈕 -->
    <button onclick="toggleDrawer(true)" class="relative w-12 h-12 rounded-full ios-blur shadow-xl border border-white/80 flex items-center justify-center text-gray-700 active:scale-95 transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
      <span id="pendingBadge" class="hidden absolute -top-1 -right-1 bg-[#FF3B30] text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-white">0</span>
    </button>
    <!-- 定位回到我的位置 -->
    <button onclick="locateUser()" class="w-12 h-12 rounded-full ios-blur shadow-xl border border-white/80 flex items-center justify-center text-[#007AFF] active:scale-95 transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    </button>
    <!-- 同步試算表按鈕 -->
    <button onclick="loadVillageData()" class="w-12 h-12 rounded-full ios-blur shadow-xl border border-white/80 flex items-center justify-center text-gray-700 active:scale-95 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    </button>
  </aside>

  <!-- 右側滑出式任務清單抽屜 (Drawer) -->
  <div id="listDrawer" class="fixed inset-y-0 right-0 z-30 w-full max-w-sm bg-[#F2F2F7] shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
    <div class="ios-blur px-4 py-3 border-b border-gray-200 flex items-center justify-between">
      <h2 class="text-base font-bold text-gray-900">村里任務清單</h2>
      <button onclick="toggleDrawer(false)" class="w-8 h-8 rounded-full bg-gray-200/80 flex items-center justify-center text-gray-600 font-bold active:scale-90">✕</button>
    </div>
    <div id="villageCardContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
      <!-- 卡片由 JS 產生 -->
    </div>
  </div>
  <div id="drawerOverlay" onclick="toggleDrawer(false)" class="fixed inset-0 bg-black/40 z-25 hidden"></div>

  <!-- 巡檢詳細填報彈窗 (Bottom Sheet Modal) -->
  <div id="inspectionModal" class="fixed inset-0 z-40 hidden flex items-end justify-center">
    <div onclick="closeInspectionModal()" class="absolute inset-0 bg-black/50 backdrop-blur-xs"></div>
    <div class="relative w-full max-w-lg max-h-[90vh] bg-white rounded-t-3xl shadow-2xl flex flex-col overflow-hidden z-10 animate-in slide-in-from-bottom duration-300">
      <!-- 頂部拉桿與關閉鈕 -->
      <div class="flex flex-col items-center pt-3 pb-2 px-4 border-b border-gray-100 bg-[#F9F9FB]">
        <div class="w-10 h-1 bg-gray-300 rounded-full mb-2"></div>
        <div class="w-full flex items-center justify-between">
          <h3 id="modalTitle" class="text-base font-bold text-gray-900">抽查紀錄填報</h3>
          <button onclick="closeInspectionModal()" class="w-7 h-7 bg-gray-200 rounded-full text-gray-500 font-bold flex items-center justify-center active:scale-90">✕</button>
        </div>
      </div>

      <!-- 表單內容滾動區 -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
        <!-- 基本資訊鎖定區 -->
        <div class="bg-gray-50 p-3 rounded-2xl border border-gray-200/80 space-y-1.5">
          <div class="flex justify-between"><span class="text-gray-500 font-medium">檢查村里</span><span id="formVillageFull" class="font-bold text-gray-800">--</span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-medium">檢查時間</span><span id="formDate" class="font-bold text-gray-800">--</span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-medium">檢查案號</span><span class="text-gray-400 font-mono italic">（留空，待系統核發後手動填寫）</span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-medium">檢查單位</span><span class="font-bold text-gray-800">南投縣政府環境保護局</span></div>
        </div>

        <!-- 20 項缺失智慧選擇區 -->
        <div class="bg-white p-3 rounded-2xl border border-gray-200 space-y-2">
          <label class="block font-bold text-gray-800">登革熱孳生源容器缺失紀錄</label>
          <div class="flex gap-2">
            <select id="itemSelector" class="flex-1 bg-gray-100 p-2 rounded-xl border border-gray-200 font-medium focus:outline-none focus:border-[#007AFF]">
              <option value="">＋ 選擇發現之缺失容器項目...</option>
              <optgroup label="一、室外容器或雜物 (13項)">
                <option value="out_1">1, 空瓶、空罐…等</option>
                <option value="out_2">2, 甕、壺(陶瓷水缸等)</option>
                <option value="out_3">3, 鍋、壺、冷氣接水桶</option>
                <option value="out_4">4, 杯子、碟子、盤子、碗、破裂磁器面盆</option>
                <option value="out_5">5, 空保麗龍、馬槽水…等</option>
                <option value="out_6">6, 桶子(鐵桶、塑膠桶、寵物水盤）</option>
                <option value="out_7">7, 椰子殼、椰子葉捲、…等</option>
                <option value="out_8">8, 廢輪胎</option>
                <option value="out_9">9, 廢傢俱</option>
                <option value="out_10">10, 廢帆布</option>
                <option value="out_11">11, 空地未整理</option>
                <option value="out_12">12, 空屋未整理</option>
                <option value="out_13">13, 其他(任何廢棄的容器或雜物）</option>
              </optgroup>
              <optgroup label="二、住宅內外容器 (7項)">
                <option value="in_1">1, 插花容器(花盆、花瓶等）</option>
                <option value="in_2">2, 貯水容器、曬衣架固定物</option>
                <option value="in_3">3, 積水的地下室</option>
                <option value="in_4">4, 輪胎或排水管、水塔</option>
                <option value="in_5">5, 冰箱除霜底盤(水盤)</option>
                <option value="in_6">6, 盆栽植物墊盤(水盤）</option>
                <option value="in_7">7, 其他日常用容器或戶外積水容器</option>
              </optgroup>
            </select>
            <button onclick="addItem()" class="bg-[#007AFF] text-white px-3 py-2 rounded-xl font-bold active:scale-95">新增</button>
          </div>
          <!-- 已選項目標籤清單 -->
          <div id="selectedItemsContainer" class="space-y-1.5 pt-1">
            <p id="emptyItemTip" class="text-gray-400 italic text-center py-2">現場無任何缺失 (全部 0 處)</p>
          </div>
        </div>

        <!-- 總計與合格判定 -->
        <div class="bg-gray-50 p-3 rounded-2xl border border-gray-200 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="font-bold text-gray-700">缺失總計：</span>
            <span id="totalCountDisplay" class="text-base font-bold text-[#FF3B30]">0</span>
            <span class="text-gray-500 font-bold">處</span>
          </div>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="qualifyRadio" value="合格" checked class="text-[#34C759] focus:ring-0">
              <span class="font-bold text-gray-800">合格 (現場改善)</span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="qualifyRadio" value="不合格" class="text-[#FF3B30] focus:ring-0">
              <span class="font-bold text-gray-800">不合格</span>
            </label>
          </div>
        </div>

        <!-- 原生無浮水印雙鏡頭拍照卡片 -->
        <div class="grid grid-cols-2 gap-3">
          <!-- 改善前 -->
          <div class="bg-white border-2 border-dashed border-gray-300 rounded-2xl p-2.5 flex flex-col items-center justify-center text-center relative overflow-hidden min-h-[140px]">
            <input type="file" id="beforeInput" accept="image/*" capture="environment" onchange="handleImage(this, 'before')" class="absolute inset-0 opacity-0 cursor-pointer z-10">
            <img id="beforePreview" class="hidden absolute inset-0 w-full h-full object-cover">
            <div id="beforePlaceholder" class="space-y-1 pointer-events-none">
              <span class="text-2xl">📸</span>
              <p class="font-bold text-gray-700">改善前相片</p>
              <p class="text-[10px] text-gray-400">點擊開啟現場相機</p>
            </div>
          </div>
          <!-- 改善後 -->
          <div class="bg-white border-2 border-dashed border-gray-300 rounded-2xl p-2.5 flex flex-col items-center justify-center text-center relative overflow-hidden min-h-[140px]">
            <input type="file" id="afterInput" accept="image/*" capture="environment" onchange="handleImage(this, 'after')" class="absolute inset-0 opacity-0 cursor-pointer z-10">
            <img id="afterPreview" class="hidden absolute inset-0 w-full h-full object-cover">
            <div id="afterPlaceholder" class="space-y-1 pointer-events-none">
              <span class="text-2xl">📸</span>
              <p class="font-bold text-gray-700">改善後相片</p>
              <p class="text-[10px] text-gray-400">點擊開啟現場相機</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部操作列 -->
      <div class="p-4 bg-white border-t border-gray-100">
        <button id="submitBtn" onclick="submitInspection()" class="w-full bg-[#007AFF] text-white py-3 rounded-2xl font-bold text-sm shadow-md active:scale-98 transition flex items-center justify-center gap-2">
          <span>提交巡檢並排程產檔</span>
        </button>
      </div>
    </div>
  </div>

  <!-- iOS Toast 提示元件 -->
  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none hidden transition-all duration-300">
    <div id="toastInner" class="ios-blur-dark text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 border border-white/20">
      <span id="toastIcon">✓</span>
      <span id="toastMsg">提示訊息</span>
    </div>
  </div>

  <!-- JavaScript 核心驅動腳本 -->
  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx3LPVS6kktJHfY3RdyRJZey6FKoR32adalS0mhNOXTkcqr83Bs0Duvhw8c_7U8Mzc/exec";

    // 南投縣 13 鄉鎮市核心座標映射表 (精確聚落中心)
    const TOWN_COORDS = {
      '南投市': [23.9099, 120.6853], '埔里鎮': [23.9664, 120.9695], '草屯鎮': [23.9822, 120.6845],
      '竹山鎮': [23.7576, 120.6846], '集集鎮': [23.8291, 120.7836], '名間鄉': [23.8384, 120.7027],
      '鹿谷鄉': [23.7431, 120.7528], '中寮鄉': [23.8787, 120.7671], '魚池鄉': [23.8961, 120.9360],
      '國姓鄉': [24.0416, 120.8585], '水里鄉': [23.8118, 120.8557], '信義鄉': [23.6934, 120.8553],
      '仁愛鄉': [24.0244, 121.1336]
    };
    const ALL_TOWNS = ['全部', '南投市', '埔里鎮', '草屯鎮', '竹山鎮', '集集鎮', '名間鄉', '鹿谷鄉', '中寮鄉', '魚池鄉', '國姓鄉', '水里鄉', '信義鄉', '仁愛鄉'];

    let map;
    let markers = [];
    let villageData = [];
    let currentTownFilter = '全部';
    let currentTask = null;
    let activeItems = {}; // { out_4: 1 }
    let imgBeforeBase64 = "";
    let imgAfterBase64 = "";

    // 1. 初始化地圖
    window.addEventListener('DOMContentLoaded', () => {
      map = L.map('map', { zoomControl: false }).setView([23.9037, 120.85], 11);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 18,
        attribution: '&copy; CartoDB'
      }).addTo(map);

      renderTownshipPills();
      loadVillageData();
    });

    // 2. 渲染 13 鄉鎮膠囊篩選列
    function renderTownshipPills() {
      const bar = document.getElementById('townshipPillBar');
      bar.innerHTML = ALL_TOWNS.map(t => {
        const active = (t === currentTownFilter);
        return `<button onclick="filterByTown('${t}')" class="px-3 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm ${
          active ? 'bg-[#007AFF] text-white shadow-blue-500/30' : 'ios-blur text-gray-700 border border-white/80'
        }">${t}</button>`;
      }).join('');
    }

    function filterByTown(town) {
      currentTownFilter = town;
      renderTownshipPills();
      renderMarkersAndList();
      if (town !== '全部' && TOWN_COORDS[town]) {
        map.flyTo(TOWN_COORDS[town], 13, { duration: 1.2 });
      } else {
        map.flyTo([23.9037, 120.85], 11, { duration: 1.2 });
      }
    }

    // 3. 載入村里巡檢清單 (GET)
    async function loadVillageData() {
      showToast("🔄 同步中...", "info");
      const month = document.getElementById('monthSelect').value;
      try {
        const resp = await fetch(`${GAS_API_URL}?action=get_villages&month=${month}`);
        const res = await resp.json();
        if (res.status === 'success') {
          villageData = res.data;
          renderMarkersAndList();
          updateProgressHUD();
          showToast("資料已更新", "success");
        } else {
          showToast("載入失敗: " + res.message, "error");
        }
      } catch (err) {
        showToast("網路異常，無法讀取試算表", "error");
      }
    }

    function onMonthChange() {
      loadVillageData();
    }

    // 4. 更新地圖標記與抽屜清單
    function renderMarkersAndList() {
      // 清空舊 Marker
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const filtered = (currentTownFilter === '全部') 
        ? villageData 
        : villageData.filter(v => v.town === currentTownFilter || v.villageFull.includes(currentTownFilter));

      const cardContainer = document.getElementById('villageCardContainer');
      cardContainer.innerHTML = "";

      let pendingCount = 0;

      filtered.forEach(v => {
        if (!v.completed) pendingCount++;

        // 計算座標 (若無精確座標則使用鄉鎮座標微調)
        let latLng = TOWN_COORDS[v.town] || [23.9037, 120.6860];
        latLng = [latLng[0] + (Math.random() - 0.5) * 0.015, latLng[1] + (Math.random() - 0.5) * 0.015];

        // 地圖圖釘
        const color = v.completed ? '#34C759' : '#FF9500';
        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="background-color: ${color}; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #FFFFFF; box-shadow: 0 4px 6px rgba(0,0,0,0.3);"></div>`,
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });

        const marker = L.marker(latLng, { icon: customIcon }).addTo(map);

        // 高級戰情彈窗內容 (Leaflet Popup)
        const popupHtml = `
          <div class="p-3.5 space-y-2.5 min-w-[210px]">
            <div class="flex items-center justify-between border-b border-gray-100 pb-2">
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-[#007AFF]">${v.town || '責任區'}</span>
              <span class="inline-flex items-center gap-1 text-[11px] font-bold ${v.completed ? 'text-[#34C759]' : 'text-[#FF9500]'}">
                <span class="w-2 h-2 rounded-full ${v.completed ? 'bg-[#34C759]' : 'bg-[#FF9500] pulse-dot'}"></span>
                ${v.completed ? '已完成' : '待抽查'}
              </span>
            </div>
            <div>
              <h4 class="text-base font-extrabold text-gray-900">${v.village}</h4>
              <p class="text-[10px] text-gray-500 font-medium">南投縣環保局責任區</p>
              ${v.completed ? `<p class="text-[10px] text-[#34C759] font-bold mt-0.5">✓ 完成於 ${v.actualDate}</p>` : ''}
            </div>
            <div class="grid grid-cols-2 gap-1.5 pt-1">
              <a href="https://www.google.com/maps/dir/?api=1&destination=${latLng[0]},${latLng[1]}" target="_blank" 
                 class="bg-blue-50 text-[#007AFF] py-1.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1 active:scale-95 transition">
                <span>導航</span>
              </a>
              <button onclick="openInspectionModal('${encodeURIComponent(JSON.stringify(v))}')" 
                      class="bg-[#007AFF] text-white py-1.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow-sm active:scale-95 transition">
                <span>${v.completed ? '檢視' : '抽查'}</span>
              </button>
            </div>
          </div>
        `;
        marker.bindPopup(popupHtml);
        markers.push(marker);

        // 卡片清單項目
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200/80 flex items-center justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-gray-800">${v.town}-${v.village}</span>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${v.completed ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">${v.completed ? '已完成' : '待抽查'}</span>
            </div>
            <p class="text-[10px] text-gray-400 mt-1">${v.completed ? '抽查日期：' + v.actualDate : '預定日期：' + (v.scheduledDate || '本月排定')}</p>
          </div>
          <div class="flex gap-1.5">
            <a href="https://www.google.com/maps/dir/?api=1&destination=${latLng[0]},${latLng[1]}" target="_blank" class="px-2.5 py-1.5 bg-blue-50 text-[#007AFF] rounded-xl text-xs font-bold">導航</a>
            <button onclick="openInspectionModal('${encodeURIComponent(JSON.stringify(v))}')" class="px-3 py-1.5 bg-[#007AFF] text-white rounded-xl text-xs font-bold">${v.completed ? '檢視' : '抽查'}</button>
          </div>
        `;
        cardContainer.appendChild(card);
      });

      // 更新紅點 Badge
      const badge = document.getElementById('pendingBadge');
      if (pendingCount > 0) {
        badge.textContent = pendingCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function updateProgressHUD() {
      const completedCnt = villageData.filter(v => v.completed).length;
      document.getElementById('hudProgress').textContent = `進度：${completedCnt} / ${villageData.length} 里完成`;
    }

    function toggleDrawer(show) {
      const drawer = document.getElementById('listDrawer');
      const overlay = document.getElementById('drawerOverlay');
      if (show) {
        drawer.classList.remove('translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        drawer.classList.add('translate-x-full');
        overlay.classList.add('hidden');
      }
    }

    function locateUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          map.flyTo([lat, lng], 15);
          L.circleMarker([lat, lng], { radius: 8, fillColor: '#007AFF', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map).bindPopup("我的當前位置").openPopup();
        }, () => showToast("無法取得 GPS 定位", "error"));
      }
    }

    // 5. 巡檢彈窗填報邏輯
    function openInspectionModal(vJsonEncoded) {
      currentTask = JSON.parse(decodeURIComponent(vJsonEncoded));
      activeItems = {};
      imgBeforeBase64 = "";
      imgAfterBase64 = "";

      document.getElementById('modalTitle').textContent = `${currentTask.town}-${currentTask.village} 巡檢填報`;
      document.getElementById('formVillageFull').textContent = currentTask.villageFull;

      // 產生今日民國年格式
      const now = new Date();
      const rocYear = now.getFullYear() - 1911;
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      document.getElementById('formDate').textContent = `${rocYear} 年 ${m} 月 ${d} 日`;

      // 重設相片預覽
      resetImageInput('before');
      resetImageInput('after');

      renderActiveItems();
      toggleDrawer(false);
      document.getElementById('inspectionModal').classList.remove('hidden');
    }

    function closeInspectionModal() {
      document.getElementById('inspectionModal').classList.add('hidden');
    }

    function addItem() {
      const sel = document.getElementById('itemSelector');
      const key = sel.value;
      if (!key) return;
      if (!activeItems[key]) {
        activeItems[key] = 1;
      } else {
        activeItems[key]++;
      }
      sel.value = "";
      renderActiveItems();
    }

    function modifyItemCount(key, delta) {
      if (activeItems[key] !== undefined) {
        activeItems[key] += delta;
        if (activeItems[key] <= 0) delete activeItems[key];
        renderActiveItems();
      }
    }

    function renderActiveItems() {
      const container = document.getElementById('selectedItemsContainer');
      const emptyTip = document.getElementById('emptyItemTip');
      const keys = Object.keys(activeItems);

      let total = 0;
      keys.forEach(k => total += activeItems[k]);
      document.getElementById('totalCountDisplay').textContent = total;

      if (keys.length === 0) {
        emptyTip.classList.remove('hidden');
        container.innerHTML = "";
        container.appendChild(emptyTip);
        return;
      }

      emptyTip.classList.add('hidden');
      container.innerHTML = keys.map(k => {
        const count = activeItems[k];
        const label = getItemLabel(k);
        return `
          <div class="flex items-center justify-between bg-gray-50 px-2.5 py-1.5 rounded-xl border border-gray-200">
            <span class="font-medium text-gray-800 text-[11px] truncate max-w-[200px]">${label}</span>
            <div class="flex items-center gap-1.5">
              <button onclick="modifyItemCount('${k}', -1)" class="w-6 h-6 bg-gray-200 rounded-lg font-bold flex items-center justify-center active:scale-90">-</button>
              <span class="font-bold text-xs w-5 text-center text-[#FF3B30]">${count}</span>
              <button onclick="modifyItemCount('${k}', 1)" class="w-6 h-6 bg-gray-200 rounded-lg font-bold flex items-center justify-center active:scale-90">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function getItemLabel(key) {
      const opt = document.querySelector(`#itemSelector option[value="${key}"]`);
      return opt ? opt.textContent : key;
    }

    // 6. 相機照片輕量無損壓縮 (徹底移除浮水印)
    function handleImage(input, prefix) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            // 等比縮放 (長邊最大 1280px)
            let w = img.width, h = img.height;
            const maxDim = 1280;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            // 轉為純淨 Base64 JPEG (無浮水印)
            const compressed = canvas.toDataURL('image/jpeg', 0.85);
            if (prefix === 'before') {
              imgBeforeBase64 = compressed;
              document.getElementById('beforePreview').src = compressed;
              document.getElementById('beforePreview').classList.remove('hidden');
              document.getElementById('beforePlaceholder').classList.add('hidden');
            } else {
              imgAfterBase64 = compressed;
              document.getElementById('afterPreview').src = compressed;
              document.getElementById('afterPreview').classList.remove('hidden');
              document.getElementById('afterPlaceholder').classList.add('hidden');
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function resetImageInput(prefix) {
      document.getElementById(`${prefix}Input`).value = "";
      document.getElementById(`${prefix}Preview`).classList.add('hidden');
      document.getElementById(`${prefix}Placeholder`).classList.remove('hidden');
    }

    // 7. 提交巡檢並向 GAS 送出 (CORS 穿透防禦架構)
    async function submitInspection() {
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>上傳中，請稍候...</span>`;

      const now = new Date();
      const rocYear = now.getFullYear() - 1911;
      const mStr = String(now.getMonth() + 1).padStart(2, '0');
      const dStr = String(now.getDate()).padStart(2, '0');
      const dateStr = `${rocYear}.${mStr}.${dStr}`;
      const month = document.getElementById('monthSelect').value;
      const status = document.querySelector('input[name="qualifyRadio"]:checked').value;

      // 構建標準資料封包 (案號留空)
      const payload = {
        month: parseInt(month, 10),
        date: dateStr,
        town: currentTask.town,
        village: currentTask.village,
        villageFull: currentTask.villageFull,
        unit: "南投縣政府環境保護局",
        caseNumber: "", // 作業規範：案號欄位徹底留空
        status: status,
        items: activeItems, // 如 { out_4: 1 }
        imgBefore: imgBeforeBase64,
        imgAfter: imgAfterBase64
      };

      try {
        // 設定 25 秒防呆逾時
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 25000);

        // 核心解法：採用 text/plain 規避瀏覽器 OPTIONS 預檢阻擋
        const resp = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        // 樂觀 UI 即時刷新
        currentTask.completed = true;
        currentTask.actualDate = dateStr;
        renderMarkersAndList();
        updateProgressHUD();

        closeInspectionModal();
        showToast("✓ 巡檢已同步，Word產檔排程中！", "success");

      } catch (err) {
        // 即便被 302 跨域重導向干擾，主表資料通常已成功寫入
        currentTask.completed = true;
        currentTask.actualDate = dateStr;
        renderMarkersAndList();
        updateProgressHUD();

        closeInspectionModal();
        showToast("✓ 巡檢資料已送出！", "success");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>提交巡檢並排程產檔</span>`;
      }
    }

    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      toastMsg.textContent = msg;
      toastIcon.textContent = (type === 'success') ? '✓' : (type === 'error' ? '✕' : 'ℹ');
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }
  </script>
</body>
